<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FASAPlayer — Architecture Visualizer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-start">
        <nav class="site-nav" aria-label="Site">
          <a href="/">Admin</a>
          <a href="/architecture.html" class="active" aria-current="page">Architecture</a>
          <a href="/images.html">Images</a>
        </nav>
        <div>
          <h1 id="title">FASAPlayer</h1>
          <p id="subtitle" class="subtitle"></p>
        </div>
      </div>
      <div class="header-actions">
        <label class="search-label">
          <span class="sr-only">Filter components</span>
          <input type="search" id="filter" placeholder="Filter components…" autocomplete="off" />
        </label>
        <button type="button" id="btn-reset" class="btn btn-ghost">Clear flow</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="Data flows">
        <h2 class="sidebar-title">Data flows</h2>
        <p class="sidebar-hint">Click a flow to highlight paths through the stack (top → bottom).</p>
        <ul id="flow-list" class="flow-list"></ul>
        <section class="detail-panel" id="detail-panel" hidden>
          <h3 id="detail-title"></h3>
          <p id="detail-desc" class="detail-desc"></p>
          <dl id="detail-meta" class="detail-meta"></dl>
          <ol id="detail-steps" class="detail-steps" hidden></ol>
          <div id="detail-cache" class="detail-cache" hidden></div>
        </section>
        <section class="docs-link">
          <p>Source data: <code>web/data/architecture.json</code></p>
        </section>
      </aside>

      <main class="canvas-wrap">
        <div id="layers" class="layers"></div>
        <svg id="connections" class="connections" aria-hidden="true"></svg>
      </main>
    </div>

    <footer class="footer">
      <span>Dev resource — architecture map</span>
      <span id="ports-hint"></span>
    </footer>

    <script type="module" src="/visualizer.js"></script>
  </body>
</html>
